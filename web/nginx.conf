# Phuc vu UI tieng Viet + proxy API ve LibreTranslate, CUNG MOT ORIGIN.
# Nho vay web app sau nay khong phai phu thuoc CORS, va cookie/sesssion neu
# can them ve sau cung hoat dong binh thuong.

server {
    listen       80;
    # Nghe ca IPv6: trong container /etc/hosts co '::1 localhost', neu chi
    # bind IPv4 thi moi client chon ::1 (vd busybox wget) se bi Connection refused.
    listen       [::]:80;
    server_name  _;
    server_tokens off;      # khong lo phien ban nginx
    root         /usr/share/nginx/html;
    index        index.html;

    # Khong cache UI: sua file la thay ngay sau khi tai lai trang.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "no-referrer";
        # UI khong nap gi tu ben ngoai — khoa lai de dung nhu vay.
        add_header Content-Security-Policy
            "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'";
    }

    # DNS noi bo cua Docker. Bat buoc phai co khi dung BIEN trong proxy_pass.
    #
    # Vi sao dung bien: nginx phan giai ten upstream MOT LAN luc nap config.
    # Neu viet thang 'proxy_pass http://engine:8000' ma container engine chua
    # ton tai, nginx KHONG KHOI DONG DUOC -> mat luon ca UI. Dung bien thi no
    # phan giai theo tung request: engine chet chi tra 502, UI van song.
    # Ngoai ra container duoc tao lai se doi IP — cach nay bat kip, cach cu thi khong.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # /api/... -> goc cua LibreTranslate
    location /api/ {
        set                $lt http://libretranslate:5000;
        rewrite            ^/api/(.*)$ /$1 break;
        proxy_pass         $lt;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 64m;
        # BO header CORS rong cua LibreTranslate.
        #
        # LibreTranslate tu dat Access-Control-Allow-Origin: * cho moi phan hoi.
        # Voi mot may chu chay tren loopback, dieu do co nghia: BAT KY trang web
        # nao ban ghe cung co the goi may chu dich cua ban tu trinh duyet cua ban.
        # Khong client nao cua du an nay can no:
        #   - UI web cung origin (:5001 -> /api), CORS khong ap dung
        #   - extension goi tu service worker voi host_permissions, khong chiu CORS
        #   - examples dung curl/python, khong phai trinh duyet
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
    }

    # /api2/... -> engine EnViT5 (tuy chon: engine tat thi cho 502, UI tu an di)
    location /api2/ {
        set                $engine http://engine:8000;
        rewrite            ^/api2/(.*)$ /$1 break;
        proxy_pass         $engine;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # BO header CORS rong cua LibreTranslate.
        #
        # LibreTranslate tu dat Access-Control-Allow-Origin: * cho moi phan hoi.
        # Voi mot may chu chay tren loopback, dieu do co nghia: BAT KY trang web
        # nao ban ghe cung co the goi may chu dich cua ban tu trinh duyet cua ban.
        # Khong client nao cua du an nay can no:
        #   - UI web cung origin (:5001 -> /api), CORS khong ap dung
        #   - extension goi tu service worker voi host_permissions, khong chiu CORS
        #   - examples dung curl/python, khong phai trinh duyet
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
    }

    # /translate_file tra ve URL tuyet doi dang http://<host>/download_file/...
    # (url_for(_external=True) dung header Host). Vi ta giu nguyen Host nen
    # duong dan do tro ve chinh nginx nay — phai proxy no o goc.
    location /download_file/ {
        set                $ltdl http://libretranslate:5000;
        proxy_pass         $ltdl$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host $http_host;
        proxy_read_timeout 300s;
    }

    # Swagger cua LibreTranslate, tien khi phat trien app.
    location /docs { set $ltd http://libretranslate:5000; proxy_pass $ltd$request_uri; proxy_set_header Host $http_host; }
    location /spec { set $lts http://libretranslate:5000; proxy_pass $lts$request_uri; proxy_set_header Host $http_host; }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
}
