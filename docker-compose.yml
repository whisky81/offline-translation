# LibreTranslate - may chu dich offline (Web UI + REST API)
# Vong doi container do systemd quan ly (xem systemd/libretranslate.service.in),
# nen o day restart = "no": tranh hai co che restart danh nhau.

# Ten project dat co dinh: khong phu thuoc ten thu muc, va khong dung ten
# voi bat ky stack nao ben Docker Desktop.
name: setup-translate

services:
  libretranslate:
    image: ${LT_IMAGE:-libretranslate/libretranslate:latest}
    container_name: libretranslate
    restart: "no"

    # KHONG cong bo cong ra host. LibreTranslate chi tiep can duoc qua nginx
    # o :5001/api — mot cua duy nhat, va cua do da bo header CORS rong.
    expose:
      - "5000"

    environment:
      # --- mang trong container (khong cong bo ra host) ---
      LT_HOST: "0.0.0.0"
      LT_PORT: "5000"

      # --- ngon ngu & model ---
      LT_LOAD_ONLY: "${LT_LOAD_ONLY}"
      LT_UPDATE_MODELS: "${LT_UPDATE_MODELS:-false}"

      # --- hieu nang ---
      LT_THREADS: "${LT_THREADS:-8}"
      OMP_NUM_THREADS: "${OMP_NUM_THREADS:-6}"
      ARGOS_DEVICE_TYPE: "cpu"

      # --- web ui ---
      LT_FRONTEND_TITLE: "${LT_FRONTEND_TITLE:-Local Translate}"
      LT_FRONTEND_LANGUAGE: "${LT_FRONTEND_LANGUAGE:-en}"
      LT_DISABLE_WEB_UI: "${LT_DISABLE_WEB_UI:-true}"
      LT_FRONTEND_LANGUAGE_SOURCE: "${LT_FRONTEND_LANGUAGE_SOURCE:-auto}"
      LT_FRONTEND_LANGUAGE_TARGET: "${LT_FRONTEND_LANGUAGE_TARGET:-vi}"
      LT_FRONTEND_TIMEOUT: "${LT_FRONTEND_TIMEOUT:-500}"

      # --- api ---
      LT_CHAR_LIMIT: "${LT_CHAR_LIMIT:--1}"
      LT_REQ_LIMIT: "${LT_REQ_LIMIT:--1}"
      LT_BATCH_LIMIT: "${LT_BATCH_LIMIT:--1}"
      LT_DISABLE_FILES_TRANSLATION: "${LT_DISABLE_FILES_TRANSLATION:-false}"
      LT_SUGGESTIONS: "${LT_SUGGESTIONS:-false}"
      LT_METRICS: "${LT_METRICS:-false}"

    # Model tai ve nam trong volume -> khong phai tai lai khi update image.
    volumes:
      - lt_models:/home/libretranslate/.local

    # Tran RAM cho container. Laptop 14 GB -> chua ~5 GB la du an toan.
    mem_limit: ${LT_MEM_LIMIT:-5g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    healthcheck:
      # Script co san trong image chinh thuc.
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Lan chay dau phai tai model -> cho thoai mai truoc khi tinh la loi.
      start_period: 600s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Engine thu hai: EnViT5 (VietAI) chay bang CTranslate2 int8.
  # Chi dich en<->vi nhung chuyen cho cap do; LibreTranslate van lo phan con lai.
  engine:
    build:
      context: ./engine
      args:
        MODEL_ID: ${ENGINE_MODEL_ID:-VietAI/envit5-translation}
        QUANT: ${ENGINE_QUANT:-int8}
    image: ${ENGINE_IMAGE:-lt-engine-envit5:1}
    container_name: lt-engine
    restart: "no"
    environment:
      MODEL_ID: "${ENGINE_MODEL_ID:-VietAI/envit5-translation}"
      INTRA_THREADS: "${ENGINE_INTRA_THREADS:-4}"
      BEAM_SIZE: "${ENGINE_BEAM_SIZE:-2}"
    mem_limit: ${ENGINE_MEM_LIMIT:-3g}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # UI tieng Viet rieng + proxy cung origin toi API.
  web:
    image: ${WEB_IMAGE:-nginx:1.29-alpine}
    container_name: lt-web
    restart: "no"
    depends_on:
      - libretranslate
      - engine
    # Co dinh 127.0.0.1: khong de mot bien trong .env vo tinh mo ra ca mang.
    # Muon chia se trong LAN thi phai sua chinh tep nay — mot hanh dong co y thuc.
    ports:
      - "127.0.0.1:${WEB_PORT:-5001}:80"
    volumes:
      - ./web/html:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # nginx can bind cong 80 trong container va doi user cho worker.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    healthcheck:
      # Dung 127.0.0.1 chu khong phai 'localhost': ten do phan giai ca ::1,
      # va client se thu IPv6 truoc.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  lt_models:
    name: libretranslate_models

# Ghim dai IP de lan chay nao cung giong nhau, thay vi de Docker boc tuy y
# trong pool 172.17-172.31 (phong ngua, chua tung thay va cham thuc te).
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.5.0/24
